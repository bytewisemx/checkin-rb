<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Russell Bedford | Redirigiendo...</title>
  <script type="text/javascript">
    // SPA GitHub Pages Redirect Script
    // Redirige rutas directas (como /login, /tasks, /register) hacia index.html preservando la ruta para React Router
    (function() {
      // 1 segmento a preservar porque el proyecto corre en subcarpeta: /checkin-rb/
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var pathParts = l.pathname.split('/');
      
      // Si estamos en un subpath dentro de /checkin-rb/
      var repoBasePath = pathParts.slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = pathParts.slice(1 + pathSegmentsToKeep).join('/');

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBasePath + '/?/' +
        routePath.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      l.replace(redirectUrl);
    })();
  </script>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; background-color: #0b111e; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center; padding: 20px;">
    <div style="width: 36px; height: 36px; border: 3px solid #1e40af; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
    <p style="font-size: 14px; color: #94a3b8; font-weight: 500;">Cargando plataforma Russell Bedford...</p>
  </div>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
