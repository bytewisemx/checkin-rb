<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Sombra de profundidad 3D ambiental -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#02142B" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0369A1" flood-opacity="0.4" />
    </filter>

    <!-- Degradado de la cara frontal de la palomita -->
    <linearGradient id="checkFront" x1="14" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Degradado de extrusión lateral derecha (luz intermedia) -->
    <linearGradient id="checkSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F2A56" />
    </linearGradient>

    <!-- Degradado de la base inferior (sombra profunda 3D) -->
    <linearGradient id="checkBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E3A" />
      <stop offset="50%" stop-color="#0A182E" />
      <stop offset="100%" stop-color="#030C19" />
    </linearGradient>

    <!-- Bisel de iluminación especular superior -->
    <linearGradient id="checkHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#BAE6FD" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Resplandor esférico en la punta -->
    <radialGradient id="tipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g filter="url(#shadow3d)">
    <!-- 1. Capa de Extrusión Inferior y Lateral 3D (Volumen físico del botón/check) -->
    <!-- Caras inferiores y laterales extruidas hacia abajo (+5px) -->
    <path
      d="M13 33.5 L24.5 45 L50.5 15.5 L53.5 19 L25 50.5 L10 35.5 Z"
      fill="url(#checkBottom)"
    />
    <path
      d="M24.5 45 L50.5 15.5 L52 17.5 L25 50.5 Z"
      fill="url(#checkSide)"
    />
    <path
      d="M10 35.5 L13 33.5 L24.5 45 L25 50.5 Z"
      fill="#0A2548"
    />

    <!-- 2. Cara Frontal Principal en Relieve 3D -->
    <path
      d="M13 32 L24.5 43.5 L50.5 14 C51.6 12.8 53.4 12.8 54.5 14 C55.6 15.2 55.6 17 54.5 18.2 L26.5 49 C25.4 50.2 23.6 50.2 22.5 49 L10.5 37 C9.4 35.8 9.4 34 10.5 32.8 C11.1 32.2 12.1 32 13 32 Z"
      fill="url(#checkFront)"
    />

    <!-- 3. Bisel de Luz Superior (Reflejo de luz cenital) -->
    <path
      d="M13.5 32.8 L24.5 43.8 L53 14.8 C53.8 14 54.8 14.2 54.2 15 L26 48 C25.2 49 23.8 49 23 48.2 L11.2 36.4 C10.6 35.8 11.2 34.8 12 34 L13.5 32.8 Z"
      fill="url(#checkHighlight)"
      opacity="0.75"
    />

    <!-- 4. Puntos de brillo especular 3D -->
    <!-- Destello en la punta derecha -->
    <circle cx="53" cy="15.5" r="2.5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="53" cy="15.5" r="4.5" fill="url(#tipGlow)" />

    <!-- Destello en el codo de la palomita -->
    <circle cx="24.5" cy="45" r="2" fill="#BAE6FD" opacity="0.6" />
  </g>
</svg>
