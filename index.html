  <script type="text/javascript">
    // SPA GitHub Pages Router Restore
    // Restaura la URL original cuando se accede directamente a una ruta compartida como /login o /register
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
  <script>
    (function() {
      try {
        let theme = 'dark';
        const rawStore = localStorage.getItem('checkin-rb-storage-v2') || localStorage.getItem('checkin-rb-storage');
        if (rawStore) {
          const parsed = JSON.parse(rawStore);
          if (parsed && parsed.state && parsed.state.theme) {
            theme = parsed.state.theme;
          }
        } else {
          const direct = localStorage.getItem('rb_theme');
          if (direct) theme = direct;
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
