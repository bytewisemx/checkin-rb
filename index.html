<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="alternate icon" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Russell Bedford | Gestión de Proyectos y Asistencia</title>
  <script>
    (function() {
      try {
        let theme = 'dark';
        const rawStore = localStorage.getItem('checkin-rb-storage');
        if (rawStore) {
          const parsed = JSON.parse(rawStore);
          if (parsed && parsed.state && parsed.state.theme) {
            theme = parsed.state.theme;
          }
        } else {
          const direct = localStorage.getItem('rb_theme');
          if (direct) theme = direct;
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <script type="module" crossorigin src="/checkin-rb/assets/index-DU-2qaoU.js"></script>
  <link rel="stylesheet" crossorigin href="/checkin-rb/assets/index-B6PWJdvt.css">
</head>

</body>

</html>
